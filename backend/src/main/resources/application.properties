spring.application.name=OLITRACK

server.port=${PORT:${SERVER_PORT:8080}}

firebase.project-id=olitrack-f0fcc

firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:olitrack-f0fcc.firebasestorage.app}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://olitrack-f0fcc.web.app}

spring.jackson.default-property-inclusion=non_null

spring.codec.max-in-memory-size=6MB

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=when-authorized

spring.devtools.restart.enabled=true

logging.level.com.example.backend=DEBUG

logging.level.org.springframework.security=INFO