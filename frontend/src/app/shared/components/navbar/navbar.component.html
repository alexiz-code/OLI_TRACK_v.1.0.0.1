
    <header class="sticky top-0 z-40 bg-slate-900 border-b border-slate-800 text-white shadow-lg">

      <div class="bg-slate-950/80 px-4 py-1.5 border-b border-slate-800/80 flex items-center justify-between text-xs">
        <span class="text-slate-300 font-semibold">
          Ayacucho, PE (Huamanga)
        </span>

        <span class="text-slate-400">
          Hielo Purificado SAC
        </span>
      </div>

      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">

        <!-- Logo -->
        <div class="flex items-center gap-3">

          <div
            class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-black text-white text-sm shadow-md"
          >
            OFI
          </div>

          <div>
            <span class="font-black text-lg tracking-tight text-white">
              OLI<span class="text-blue-400">TRACK</span>
            </span>

            <p class="text-[11px] text-slate-400">
              Distribución de Hielos, Monitoreo GPS &amp; Kardex
            </p>
          </div>

        </div>

        <!-- Usuario autenticado -->
        @if (service.currentUser(); as usuario) {

          <div class="flex items-center gap-3">

            <div class="text-right hidden sm:block">
              <p class="text-xs font-bold text-white">
                {{ usuario.nombre }}
              </p>

              <p class="text-[10px] text-blue-300 font-semibold">
                {{ usuario.rol }}
              </p>
            </div>

            <button
              type="button"
              (click)="cerrarSesion()"
              class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 transition-colors"
            >
              Cerrar sesión
            </button>

          </div>

        }

        <!-- Usuario no autenticado -->
        @if (!service.currentUser()) {

          <a
            routerLink="/login"
            class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white"
          >
            Iniciar sesión
          </a>

        }

      </div>
    </header>
