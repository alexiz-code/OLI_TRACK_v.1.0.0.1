
    <div
      class="relative rounded-2xl overflow-hidden border border-slate-200
             shadow-sm bg-slate-100 w-full"
    >

      <!-- ENCABEZADO -->
      <div
        class="absolute top-3 left-3 z-[400]
               flex items-center gap-2
               bg-white/95 backdrop-blur-md
               px-3 py-1.5 rounded-xl
               border border-slate-200 shadow-sm
               text-xs font-medium text-slate-700"
      >
        <span
          class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"
        ></span>

        <span class="font-bold">
          Ayacucho (Huamanga)
        </span>

        <span class="text-slate-400 text-[10px]">
          Última ubicación recibida
        </span>
      </div>

      <!-- BOTONES -->
      <div
        class="absolute top-3 right-3 z-[400]
               flex items-center gap-1.5"
      >

        <button
          type="button"
          (click)="fitAllPoints()"
          class="bg-white/95 hover:bg-white
                 text-slate-700 hover:text-blue-600
                 px-3 py-1.5 rounded-xl
                 border border-slate-200 shadow-sm
                 text-xs font-semibold transition-colors"
        >
          Ajustar Todo
        </button>

        <button
          type="button"
          (click)="recenterCentral()"
          class="bg-white/95 hover:bg-white
                 text-slate-700 hover:text-blue-600
                 px-3 py-1.5 rounded-xl
                 border border-slate-200 shadow-sm
                 text-xs font-semibold transition-colors"
        >
          Planta Central
        </button>

      </div>

      <!-- MAPA -->
      <div
        #mapContainer
        [style.height]="height()"
        class="w-full z-10"
      ></div>

      @if (showLegend()) {
        <!-- LEYENDA -->
        <div
          class="absolute bottom-3 right-3 z-[400]
                 bg-white/95 backdrop-blur-md
                 px-3 py-2 rounded-xl
                 border border-slate-200 shadow-md
                 text-[11px]
                 flex flex-wrap items-center gap-3"
        >

        @if (showAlmacen()) {
          <div class="flex items-center gap-1.5">

            <span
              class="w-2.5 h-2.5 rounded-full bg-blue-600"
            ></span>

            <span class="text-slate-700 font-medium">
              Planta Central
            </span>

          </div>
        }

        @if (showRepartidores()) {
          <div class="flex items-center gap-1.5">

            <span
              class="w-2.5 h-2.5 rounded-full bg-emerald-600"
            ></span>

            <span class="text-slate-700 font-medium">
              Repartidor disponible
            </span>

          </div>

          <div class="flex items-center gap-1.5">

            <span
              class="w-2.5 h-2.5 rounded-full bg-amber-500"
            ></span>

            <span class="text-slate-700 font-medium">
              En ruta
            </span>

          </div>
        }

        @if (showClientes()) {
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
            <span class="text-slate-700 font-medium">Pedido reciente (1–3 días)</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span>
            <span class="text-slate-700 font-medium">4–6 días</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-red-600"></span>
            <span class="text-slate-700 font-medium">7+ días</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
            <span class="text-slate-700 font-medium">Sin pedidos</span>
          </div>
        }

        @if (tienePedidosAsignados()) {
          <div class="flex items-center gap-1.5">
            <span class="h-0.5 w-5 border-t-2 border-dashed border-blue-600"></span>
            <span class="text-slate-700 font-medium">Ruta aproximada</span>
          </div>
        }

        </div>
      }
    </div>
